ote">İlk kurulumdan sonra çoğu ekran çevrimdışı açılır. AI koçu internet bağlantısı ister.</p>`)}`}
function flash(text){let t=$('toast');t.textContent=text;t.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>t.style.display='none',4200)}
const number=(v,min=0,max=999999)=>{const n=Number(v);if(!Number.isInteger(n)||n<min||n>max)throw Error(`Geçersiz sayı: ${v}`);return n};
function addTask(v){const date=String(v.date||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(dateObj(date).getTime()))throw Error('Görev tarihi geçersiz');let title=String(v.title||'').trim().slice(0,120),subject=String(v.subject||'TYT Matematik');if(!title)throw Error('Görev açıklaması eksik');if(!caps.includes(subject))subject='TYT Matematik';let mins=number(v.minutes??45,5,720),q=number(v.questions??0,0,2000),time=String(v.time||'').slice(0,5);if(time&&!/^\d{2}:\d{2}$/.test(time))throw Error('Saat biçimi HH:MM olmalı');let key=[date,title,subject,time].join('|');if(data.tasks.some(t=>[t.date,t.title,t.subject,t.time||''].join('|')===key))return false;data.tasks.push({id:uid(),date,title,subject,time,minutes:mins,questions:q,done:false});return true}
function submit(e){const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const kind=form.dataset.form,fd=new FormData(form);try{if(kind==='task'){addTask(Object.fromEntries(fd));persist();flash('Görev eklendi');view='program'}
else if(kind==='questions'){let entry={id:uid(),date:fd.get('date'),subject:fd.get('subject'),topic:String(fd.get('topic')||'').trim().slice(0,100),d:number(fd.get('d'),0,9999),y:number(fd.get('y'),0,9999),b:number(fd.get('b'),0,9999)};if(entry.d+entry.y+entry.b===0)throw Error('En az bir soru gir');data.questions.push(entry);persist();flash('Doğru / yanlış / boş kaydedildi')}
else if(kind==='session'){let mins=number(fd.get('minutes'),1,720);data.sessions.push({id:uid(),date:fd.get('date'),subject:fd.get('subject'),minutes:mins});persist();flash('Çalışma süresi kaydedildi')}
else if(kind==='topic'){let name=String(fd.get('name')||'').trim();if(!name)throw Error('Konu adı eksik');data.topics.push({id:uid(),subject:topicGroup,name,status:0});persist();flash('Konu eklendi')}
else if(kind==='mistake'){let topic=String(fd.get('topic')||'').trim();if(!topic)throw Error('Konu yaz');data.mistakes.push({id:uid(),subject:fd.get('subject'),topic,reason:fd.get('reason'),note:String(fd.get('note')||'').slice(0,3000),date:today()});persist();flash('Yanlış defterine eklendi')}
else if(kind==='exam'){let parts=examBlueprint[examType].map(([name,max],i)=>{let d=number(fd.get('d'+i),0,max),y=number(fd.get('y'+i),0,max),b=number(fd.get('b'+i),0,max);if(d+y+b!==max)throw Error(name+': Doğru + yanlış + boş = '+max+' olmalı');return {name,d,y,b,net:d-y/4}});let net=parts.reduce((a,p)=>a+p.net,0);data.exams.push({id:uid(),date:fd.get('date'),name:String(fd.get('name')||'').slice(0,90),type:examType,parts,net});persist();flash('Deneme kaydedildi: '+format(net,2)+' net')}
else if(kind==='settings'){const date=String(fd.get('examDate'));if(!/^2028-\d{2}-\d{2}$/.test(date)||!Number.isFinite(dateObj(date).getTime()))throw Error('2028 içinde geçerli bir tarih gir');data.settings={examDate:date,officialDate:fd.get('officialDate')==='on',dailyMinutes:number(fd.get('dailyMinutes'),15,720),weeklyMinutes:number(fd.get('weeklyMinutes'),30,7000),questionTarget:number(fd.get('questionTarget'),100,1000000)};persist();flash('Hedefler güncellendi')}
else if(kind==='import'){let raw=String(fd.get('json')||'');if(raw.length>120000)throw Error('Plan çok büyük');let parsed=JSON.parse(raw),arr=Array.isArray(parsed)?parsed:parsed.tasks;if(!Array.isArray(arr)||arr.length===0||arr.length>150)throw Error('tasks içeren geçerli bir JSON listesi gir (en fazla 150 görev)');let before=data.tasks.slice(),added=0;try{for(let t of arr){if(addTask(t))added++}}catch(error){data.tasks=before;throw error}persist();view='program';flash(added+' görev eklendi (tekrarlar atlandı)')}

else if(action==='copy-import'){const message=$('promptExample')?.textContent||'';navigator.clipboard?.writeText(message).then(()=>flash('İstek kopyalandı')).catch(()=>flash('Kopyalama için metni seçip kopyala'))}
else if(action==='coach-prompt'){const msg=node.dataset.prompt;const ta=$('coachPrompt');if(ta){ta.value=msg;ta.focus()}}
}catch(err){flash('⚠ '+err.message)}}
function backup(){let payload=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(payload),a=document.createElement('a');a.href=url;a.download=`yks2028-yedek-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);flash('JSON yedeği hazırlandı')}
function change(e){let el=e.target;if(el.id==='topicFilter'){topicGroup=el.value;render()}else if(el.dataset.topicId){let topic=data.topics.find(t=>t.id===el.dataset.topicId);if(topic){topic.status=Number(el.value);persist();render()}}else if(el.id==='datePick'){dateSelected=el.value;render()}else if(el.name==='timerSubject'){data.timer.subject=el.value;persist()}else if(el.id==='backupFile'){restoreBackup(el.files?.[0])}}
async function restoreBackup(file){if(!file)return;try{if(file.size>2000000)throw Error('Yedek dosyası çok büyük');let value=JSON.parse(await file.text());if(value?.version!==2||!['tasks','questions','topics','sessions','exams','mistakes','messages'].every(k=>Array.isArray(value[k]))||!value.settings||!value.timer)throw Error('Bu dosya YKS 2028 v2 yedeği değil');if(!confirm('Mevcut kayıtların yerine bu yedek yüklensin mi?'))return;data=value;persist();view='home';render();flash('Yedek yüklendi')}catch(err){flash('⚠ '+err.message)}}
function clockTick(){let label=$('liveclock');if(label)label.textContent=humanTime(timerElapsed())}
function updateClock(){clockTick()}
async function askCoach(prompt){if(coachBusy)return;prompt=prompt.trim();if(!prompt)return flash('Koçuna bir mesaj yaz');let code=$('accessCode')?.value||'';if(!code)return flash('Önce sunucu erişim kodunu gir');coachBusy=true;let btn=document.querySelector('form[data-form="coach"] button');if(btn){btn.disabled=true;btn.textContent='Yanıt hazırlanıyor…'}
try{let context={today:today(),goal:'2028 YKS EA İstanbul Üniversitesi Hukuk Fakültesi',topicProgress:caps.map(s=>({subject:s,percent:topicPercentage(s)})),recentQuestions:data.questions.slice(-50),recentSessions:data.sessions.slice(-40),recentExams:data.exams.slice(-8),recentTasks:data.tasks.filter(t=>t.date>=moveDate(today(),-7)&&t.date<=moveDate(today(),7)).slice(-80),mistakes:data.mistakes.slice(-20)};let abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),45000);let response;try{response=await fetch('/.netlify/functions/coach',{method:'POST',headers:{'Content-Type':'application/json','X-Coach-Code':code},body:JSON.stringify({prompt,context}),signal:abort.signal})}finally{clearTimeout(timeout)}let res=await response.json().catch(()=>({}));if(!response.ok)throw Error(res.error||'Sunucu yanıt vermedi. AI bağlantısı henüz kurulmamış olabilir.');if(!res.answer)throw Error('AI yanıtı boş');data.messages.push({role:'user',text:prompt},{role:'assistant',text:String(res.answer).slice(0,10000)});if(data.messages.length>60)data.messages=data.messages.slice(-60);persist();render();flash('Koç yanıtladı')}catch(err){flash('AI: '+(err.name==='AbortError'?'İstek zaman aşımına uğradı':err.message))}finally{coachBusy=false;let button=document.querySelector('form[data-form="coach"] button');if(button){button.disabled=false;button.textContent='Mesajımı gönder'}}}
document.addEventListener('submit',submit);document.addEventListener('click',click);document.addEventListener('change',change);setInterval(clockTick,1000);document.addEventListener('visibilitychange',clockTick);window.addEventListener('pageshow',clockTick);
render();// Single-file edition intentionally omits the service worker.
})();

</script>
