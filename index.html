/* 2028 premium UI update · safe areas, native iOS select wheels, dual color themes */
:root{--bg:#f7f8fc;--panel:#fff;--ink:#22243d;--secondary:#848ba0;--border:#e9ebf3;--subtle:#f3f4fa;--accent:#6d5cdf;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark;--bg:#0f111b;--panel:#1b1f2d;--ink:#f0f0f9;--secondary:#a2acc1;--border:#31364b;--subtle:#24293a;--accent:#ad9bff}
body,:root{background:var(--bg);color:var(--ink)}
.top{background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom-color:var(--border)}
.topinner{min-height:36px}.brand b{font-weight:800;letter-spacing:-.025em;font-size:16px}
.card{background:var(--panel);color:var(--ink);border-color:var(--border);box-shadow:0 7px 25px #15132809}
.stat{background:var(--subtle)}.stat .lab,.muted,.note,.tasksub,.tiny{color:var(--secondary)}
.section,.divider-title h2,.heading,.tasktitle{color:var(--ink)}
.banner{background:var(--subtle);color:var(--ink);border-color:var(--border)}
.field label{color:var(--secondary)}
input,select,textarea{box-sizing:border-box;max-width:100%;min-width:0;background:var(--panel);color:var(--ink);border-color:var(--border);display:block;width:100%;font-size:16px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;width:100%;max-width:100%;line-height:1.3;overflow:hidden}
.formrow{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.formrow>*{min-width:0}
.duration-picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.duration-picks .field{min-width:0;margin:5px 0 10px}
.duration-picks select{font-weight:700;text-align:center;font-size:15px;min-height:52px;background:var(--subtle)}
.grid2,.grid3{min-width:0}.grid2>*,.grid3>*{min-width:0;overflow-wrap:anywhere}
.grid3 .stat{padding:11px 8px}.grid3 .stat .num{font-size:clamp(17px,5vw,21px)}
.topic-row{align-items:flex-start;gap:9px}.topic-row>div{min-width:0}.topic-status{flex:0 0 131px;width:131px;max-width:44%;padding:8px 7px;min-height:39px;font-size:12px}
.source-link{font-size:10px;color:var(--accent);display:inline-block;margin-top:4px}

if(!data?.version||!Array.isArray(data.questions)||!Array.isArray(data.tasks)||!Array.isArray(data.topics))data=createData();
function migrateData(){
 if(!data.settings||typeof data.settings!=='object')data.settings=createData().settings;
 data.settings.theme=['light','dark'].includes(data.settings.theme)?data.settings.theme:'light';
 data.settings.coachEndpoint=String(data.settings.coachEndpoint||'');
 data.settings.coachInstructions=String(data.settings.coachInstructions||'');
 if(!Array.isArray(data.archivedTopics))data.archivedTopics=[];
 if(!Array.isArray(data.mistakes))data.mistakes=[];
 if(!Array.isArray(data.messages))data.messages=[];
 if(data.version<3){
   const previous=data.topics.slice();const fresh=catalogTopics();
   for(let item of fresh){let old=previous.find(t=>t.subject===item.subject && String(t.name).toLocaleLowerCase('tr')===item.name.toLocaleLowerCase('tr'));if(old)item.status=Number(old.status)||0}
   data.archivedTopics.push(...previous);data.topics=fresh;data.version=3;
 }
 // Imported backups may have been saved before version 3 or with missing topic records.
 if(data.version===3){const ids=new Set(data.topics.map(t=>t.id));for(const t of catalogTopics())if(!ids.has(t.id)){data.topics.push(t);ids.add(t.id)}}
 document.documentElement.dataset.theme=data.settings.theme;
 document.querySelector('meta[name="theme-color"]')?.setAttribute('content',data.settings.theme==='dark'?'#10131c':'#f8f8fd');
}
migrateData();
for(const t of data.tasks)if(/^\d\d\.\d\d$/.test(t.time||''))t.time=t.time.replace('.',':');

persist();

const qTotals=arr=>arr.reduce((acc,x)=>{acc.d+=Number(x.d||0);acc.y+=Number(x.y||0);acc.b+=Number(x.b||0);return acc},{d:0,y:0,b:0});
const startedWeek=s=>{const d=dateObj(s),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const weekStart=()=>startedWeek(today());
const weekEnd=()=>moveDate(weekStart(),6);
const inWeek=(s)=>s>=weekStart()&&s<=weekEnd();
const pct=(done,total)=>total>0?range(Math.round(100*done/total),0,100):0;

const allTopics=()=>activeTopics().length;
const topicFinished=()=>activeTopics().filter(x=>Number(x.status)===2).length;
const solved=arr=>arr.reduce((a,x)=>a+Number(x.d||0)+Number(x.y||0),0);

const PHOTO_DB='yks2028-photos-v1';
const photoDb=()=>new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('Bu tarayıcı fotoğraf depolamayı desteklemiyor'));const req=indexedDB.open(PHOTO_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('photos'))req.result.createObjectStore('photos',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function photoSet(record){const db=await photoDb();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(record);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function photoGet(id){const db=await photoDb();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly'),req=tx.objectStore('photos').get(id);req.onsuccess=()=>{db.close();resolve(req.result||null)};req.onerror=()=>{db.close();reject(req.error)}})}
async function photoDelete(id){if(!id)return;const db=await photoDb();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function photoAll(){const db=await photoDb();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly'),req=tx.objectStore('photos').getAll();req.onsuccess=()=>{db.close();resolve(req.result||[])};req.onerror=()=>{db.close();reject(req.error)}})}
async function compressPhoto(file){if(!file.type.startsWith('image/'))throw Error('Lütfen fotoğraf seç');if(file.size>20000000)throw Error('Fotoğraf 20 MB sınırını aşıyor');const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Fotoğraf açılamadı'));img.src=url});const ratio=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const dataUrl=canvas.toDataURL('image/jpeg',0.72);if(dataUrl.length>1900000)throw Error('Fotoğraf sıkıştırılamadı; daha küçük bir görsel dene');return dataUrl}finally{URL.revokeObjectURL(url)}}
async function loadPhotoThumbs(){for(const img of document.querySelectorAll('img[data-photo-id]')){try{const photo=await photoGet(img.dataset.photoId);if(!img.isConnected)continue;if(photo?.data){img.src=photo.data;img.nextElementSibling?.remove();}else{img.alt='Görsel bulunamadı';img.nextElementSibling?.replaceWith(document.createTextNode('Fotoğraf bu cihazda bulunamadı.'))}}catch(e){img.alt='Görsel yüklenemedi'}}}
function coachSummary(){const q=qTotals(data.questions),done=data.tasks.filter(t=>t.done).length,mins=totalMinutes(data.sessions);return `YKS 2028 EA / İstanbul Hukuk koçluk raporum\nToplam çalışma: ${mins} dakika\nGörev: ${done}/${data.tasks.length} tamamlandı\nSoru: ${q.d} doğru, ${q.y} yanlış, ${q.b} boş\nDers ilerlemesi: ${caps.map(s=>s+' %'+topicPercentage(s)).join('; ')}\nSon yanlışlar: ${data.mistakes.slice(-8).map(m=>m.subject+'/'+m.topic+'/'+m.reason).join('; ')}\nEk talimatlar: ${data.settings.coachInstructions||'Yok'}\nBunlara göre yarın için uygulanabilir bir plan öner.`}

function flash(text){let t=$('toast');t.textContent=text;t.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>t.style.display='none',4200)}
const number=(v,min=0,max=999999)=>{const n=Number(v);if(!Number.isInteger(n)||n<min||n>max)throw Error(`Geçersiz sayı: ${v}`);return n};
function addTask(v){const date=String(v.date||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(dateObj(date).getTime()))throw Error('Görev tarihi geçersiz');let title=String(v.title||'').trim().slice(0,120),subject=String(v.subject||'TYT Matematik');if(!title)throw Error('Görev açıklaması eksik');if(!caps.includes(subject))subject='TYT Matematik';let mins=number(v.minutes??45,5,720),q=number(v.questions??0,0,2000),time=String(v.time||'').slice(0,5);if(time&&!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(time))throw Error('Saat biçimi HH:MM olmalı');let key=[date,title,subject,time].join('|');if(data.tasks.some(t=>[t.date,t.title,t.subject,t.time||''].join('|')===key))return false;data.tasks.push({id:uid(),date,title,subject,time,minutes:mins,questions:q,done:false});return true}

function importContent(raw,mode){
 if(raw.length>300000)throw Error('JSON dosyası 300 KB üzerinde');
 const parsed=JSON.parse(raw);if(!parsed||typeof parsed!=='object')throw Error('JSON nesnesi bekleniyor');
 if(parsed.type && parsed.type!=='yks2028-content-update')throw Error('Tanımadığım güncelleme türü');
 if(parsed.version && parsed.type==='yks2028-content-update'&&Number(parsed.version)!==1)throw Error('Güncelleme şeması sürümü desteklenmiyor');
 const tasks=Array.isArray(parsed)?parsed:(parsed.tasks||[]),topics=parsed.topics||[];
 if(!Array.isArray(tasks)||tasks.length>150||!Array.isArray(topics)||topics.length>200)throw Error('Çok fazla veya geçersiz kayıt');
 if(!tasks.length&&!topics.length&&!parsed.settings&&!parsed.coachInstructions)throw Error('JSON içinde güncellenecek bir bölüm bulunamadı');
 const original=JSON.parse(JSON.stringify(data));let added=0,topicAdded=0;
 try{
   if(mode==='replace_future'&&tasks.length){data.tasks=data.tasks.filter(t=>t.done||t.date<today())}
   for(const t of tasks){if(addTask(t))added++}
   for(const t of topics){if(!t||typeof t!=='object'||!caps.includes(t.subject))throw Error('Konu için geçerli ders seç');let name=String(t.name||'').trim().slice(0,120);if(!name)throw Error('Konu adı eksik');let existing=data.topics.find(x=>x.subject===t.subject&&x.name===name);if(existing){if(t.status!==undefined)existing.status=number(t.status,0,2)}else{data.topics.push({id:uid(),subject:t.subject,name,grade:number(t.grade??0,0,12),branch:'Kişisel plan',kind:'Kişisel konu',source:'',status:number(t.status??0,0,2)});topicAdded++}}
   if(parsed.settings){if(typeof parsed.settings!=='object'||Array.isArray(parsed.settings))throw Error('settings nesne olmalı');for(const field of ['dailyMinutes','weeklyMinutes','questionTarget']){if(parsed.settings[field]!==undefined)data.settings[field]=number(parsed.settings[field],field==='questionTarget'?100:1,field==='questionTarget'?1000000:7000)}}
   if(parsed.coachInstructions!==undefined)data.settings.coachInstructions=String(parsed.coachInstructions).slice(0,2500);
   persist();return `${added} görev, ${topicAdded} yeni konu eklendi`;
 }catch(err){data=original;throw err}
}

async function submit(e){const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const kind=form.dataset.form,fd=new FormData(form);try{if(kind==='task'){let item=Object.fromEntries(fd);item.minutes=durationValue(fd,'task');addTask(item);persist();flash('Görev eklendi');view='program'}
else if(kind==='questions'){let entry={id:uid(),date:fd.get('date'),subject:fd.get('subject'),topic:String(fd.get('topic')||'').trim().slice(0,100),d:number(fd.get('d'),0,9999),y:number(fd.get('y'),0,9999),b:number(fd.get('b'),0,9999)};if(entry.d+entry.y+entry.b===0)throw Error('En az bir soru gir');data.questions.push(entry);persist();flash('Doğru / yanlış / boş kaydedildi')}
else if(kind==='session'){let mins=number(durationValue(fd,'session'),1,720);data.sessions.push({id:uid(),date:fd.get('date'),subject:fd.get('subject'),minutes:mins});persist();flash('Çalışma süresi kaydedildi')}
else if(kind==='topic'){let name=String(fd.get('name')||'').trim();if(!name)throw Error('Konu adı eksik');data.topics.push({id:uid(),subject:topicGroup,name,grade:0,branch:'Kişisel',kind:'Kişisel konu',source:'',status:0});persist();flash('Konu eklendi')}
else if(kind==='mistake'){let topic=String(fd.get('topic')||'').trim();if(!topic)throw Error('Konu yaz');let file=fd.get('photo'),photoId=null;if(file&&file.size){const btn=form.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Fotoğraf işleniyor…';try{let image=await compressPhoto(file);photoId=uid();await photoSet({id:photoId,data:image,date:today()})}finally{btn.disabled=false;btn.textContent='Fotoğraflı yanlışı kaydet'}}data.mistakes.push({id:uid(),subject:fd.get('subject'),topic,reason:fd.get('reason'),note:String(fd.get('note')||'').slice(0,3000),date:today(),photoId});persist();flash('Yanlış defterine eklendi')}

else if(kind==='exam'){let parts=examBlueprint[examType].map(([name,max],i)=>{let d=number(fd.get('d'+i),0,max),y=number(fd.get('y'+i),0,max),b=number(fd.get('b'+i),0,max);if(d+y+b!==max)throw Error(name+': Doğru + yanlış + boş = '+max+' olmalı');return {name,d,y,b,net:d-y/4}});let net=parts.reduce((a,p)=>a+p.net,0);data.exams.push({id:uid(),date:fd.get('date'),name:String(fd.get('name')||'').slice(0,90),type:examType,parts,net});persist();flash('Deneme kaydedildi: '+format(net,2)+' net')}
else if(kind==='settings'){const date=String(fd.get('examDate'));if(!/^2028-\d{2}-\d{2}$/.test(date)||!Number.isFinite(dateObj(date).getTime()))throw Error('2028 içinde geçerli bir tarih gir');let endpoint=String(fd.get('coachEndpoint')||'').trim();if(endpoint&&!/^https:\/\/[^\s]+$/i.test(endpoint))throw Error('AI sunucu adresi HTTPS olmalı');data.settings={...data.settings,examDate:date,officialDate:fd.get('officialDate')==='on',dailyMinutes:number(durationValue(fd,'daily'),15,720),weeklyMinutes:number(durationValue(fd,'weekly'),30,7000),questionTarget:number(fd.get('questionTarget'),100,1000000),coachEndpoint:endpoint.slice(0,500),coachInstructions:String(fd.get('coachInstructions')||'').slice(0,2500)};persist();flash('Hedefler güncellendi')}
else if(kind==='import'){let raw=String(fd.get('json')||'').trim();if(!raw)throw Error('JSON dosyasını seç veya metni yapıştır');let summary=importContent(raw,String(fd.get('mode')||'merge'));view='program';flash(summary)}
else if(kind==='coach'){askCoach(String(fd.get('prompt')||''));return}
render()}catch(err){flash('⚠ '+err.message)}}
function click(e){let node=e.target.closest('[data-action]');if(!node)return;e.preventDefault();let action=node.dataset.action,id=node.dataset.id;try{if(action==='go'){view=node.dataset.view||'home';render();scrollTo(0,0)}
else if(action==='toggle-theme'){data.settings.theme=data.settings.theme==='dark'?'light':'dark';migrateData();persist();render()}
else if(action==='topic-jump'){topicGroup=node.dataset.subject;view='progress';render()}
else if(action==='copy-coach-context'){const summary=coachSummary();navigator.clipboard?.writeText(summary).then(()=>flash('Koç özeti kopyalandı')).catch(()=>flash('Kopyalama desteklenmedi'))}
else if(action==='task-toggle'){let t=data.tasks.find(x=>x.id===id);if(t){t.done=!t.done;persist();render()}}
else if(action==='date-prev'||action==='date-next'||action==='date-today'){dateSelected=action==='date-today'?today():moveDate(dateSelected,action==='date-prev'?-1:1);render()}
else if(action==='exam-type'){examType=node.dataset.type;render()}
else if(action==='task-delete'||action==='question-delete'||action==='session-delete'||action==='exam-delete'||action==='mistake-delete'){if(!confirm('Bu kaydı silmek istiyor musun?'))return;let type={'task-delete':'tasks','question-delete':'questions','session-delete':'sessions','exam-delete':'exams','mistake-delete':'mistakes'}[action];const deleted=data[type].find(x=>x.id===id);data[type]=data[type].filter(x=>x.id!==id);if(type==='mistakes'&&deleted?.photoId)photoDelete(deleted.photoId).catch(()=>{});persist();render()}
else if(action==='timer-toggle'){let t=data.timer;if(t.running){t.elapsed=timerElapsed();t.since=null;t.running=false}else{t.subject=document.querySelector('[name="timerSubject"]')?.value||t.subject;t.running=true;t.since=Date.now()}persist();render()}
else if(action==='timer-finish'){let total=timerElapsed();if(total<60000)throw Error('Kaydetmek için en az 1 dakika çalış');if(total>720*60000&&!confirm('Sayaç 12 saati geçti. Tam süreyi kaydetmek istiyor musun?'))return;let subject=document.querySelector('[name="timerSubject"]')?.value||data.timer.subject;let mins=Math.round(total/60000);data.sessions.push({id:uid(),date:today(),subject,minutes:mins});data.timer={running:false,since:null,elapsed:0,subject};persist();render();flash(mins+' dakika kaydedildi')}
else if(action==='timer-reset'){if(timerElapsed()>0&&!confirm('Kaydedilmemiş süre sıfırlansın mı?'))return;data.timer.running=false;data.timer.since=null;data.timer.elapsed=0;persist();render()}
else if(action==='export'){backup()}
else if(action==='choose-backup'){$('backupFile')?.click()}
else if(action==='reset'){if(confirm('Bütün cihaz verileri silinecek. Önce yedek aldığından emin misin?')){data=createData();persist();view='home';render();flash('Yerel kayıtlar sıfırlandı')}}
else if(action==='copy-import'){const message=$('promptExample')?.textContent||'';navigator.clipboard?.writeText(message).then(()=>flash('İstek kopyalandı')).catch(()=>flash('Kopyalama için metni seçip kopyala'))}
else if(action==='coach-prompt'){const msg=node.dataset.prompt;const ta=$('coachPrompt');if(ta){ta.value=msg;ta.focus()}}
}catch(err){flash('⚠ '+err.message)}}
async function backup(){let photos=[];try{photos=await photoAll()}catch{flash('⚠ Fotoğraf veritabanına erişilemiyor; yedek eksik olabilir')}let payload=new Blob([JSON.stringify({...data,photos},null,2)],{type:'application/json'}),url=URL.createObjectURL(payload),a=document.createElement('a');a.href=url;a.download=`yks2028-yedek-${today()}.json`;if(window.__yksBackupUrl)URL.revokeObjectURL(window.__yksBackupUrl);window.__yksBackupUrl=url;let old=$('backupReady');old?.remove();let link=document.createElement('a');link.id='backupReady';link.href=url;link.download=a.download;link.textContent='⬇ Yedeği iPhone’a indirmek için buraya dokun';link.className='btn secondary';link.style.cssText='display:block;text-align:center;margin-top:12px';let holder=document.querySelector('[data-action="export"]')?.closest('.card')||document.body;holder.append(link);document.body.append(a);a.click();a.remove();flash('Yedek hazır. İndirme başlamazsa alttaki bağlantıya dokun')}
function change(e){let el=e.target;if(el.id==='topicFilter'){topicGroup=el.value;render()}else if(el.dataset.topicId){let topic=data.topics.find(t=>t.id===el.dataset.topicId);if(topic){topic.status=Number(el.value);persist();render()}}else if(el.id==='datePick'){dateSelected=el.value;render()}else if(el.name==='timerSubject'){data.timer.subject=el.value;persist()}else if(el.id==='backupFile'){restoreBackup(el.files?.[0])}else if(el.id==='themeSelect'){data.settings.theme=el.value;migrateData();persist();render()}else if(el.id==='planFile'){const file=el.files?.[0];if(file){if(file.size>300000)return flash('⚠ Plan dosyası 300 KB sınırını aşıyor');file.text().then(s=>{if($('planJson'))$('planJson').value=s;flash('JSON dosyası okundu; uygulamak için butona bas')}).catch(()=>flash('Dosya açılamadı'))}}else if(el.id==='mistakeSubject'){$('mistakeTopicOptions').innerHTML=subjectTopicOptions(el.value)}else if(el.id==='mistakePhoto'){const file=el.files?.[0];$('selectedPhotoInfo').textContent=file?file.name+' · '+Math.ceil(file.size/1024)+' KB':''}}
async function restoreBackup(file){if(!file)return;try{if(file.size>45000000)throw Error('Yedek dosyası 45 MB sınırını aşıyor');let value=JSON.parse(await file.text());if(![2,3].includes(value?.version)||!['tasks','questions','topics','sessions','exams','mistakes','messages'].every(k=>Array.isArray(value[k]))||!value.settings||!value.timer)throw Error('YKS 2028 v2/v3 yedeği değil');if(!confirm('Mevcut kayıtların yerine bu yedek yüklensin mi? Önce yedek almanı öneririm.'))return;let photos=Array.isArray(value.photos)?value.photos:[];delete value.photos;if(photos.length>250)throw Error('Fotoğraf sayısı çok fazla');for(const item of photos){if(!item?.id||typeof item.data!=='string'||!item.data.startsWith('data:image/'))throw Error('Yedekte geçersiz fotoğraf var')}for(const item of photos)await photoSet(item);data=value;migrateData();persist();view='home';render();flash('Yedek ve fotoğraflar yüklendi')}catch(err){flash('⚠ '+err.message)}}
function clockTick(){let label=$('liveclock');if(label)label.textContent=humanTime(timerElapsed())}
function updateClock(){clockTick()}
async function askCoach(prompt){if(coachBusy)return;prompt=prompt.trim();if(!prompt)return flash('Koçuna bir mesaj yaz');let code=$('accessCode')?.value||'';let endpoint=String(data.settings.coachEndpoint||'');if(!endpoint)return flash('AI için Ayarlar > Koç sunucusu adresini ekle veya özetini kopyala');if(!code)return flash('Sunucu erişim kodunu gir (OpenAI API anahtarı değil)');coachBusy=true;let btn=document.querySelector('form[data-form="coach"] button');if(btn){btn.disabled=true;btn.textContent='Yanıt hazırlanıyor…'}
try{let context={today:today(),goal:'2028 YKS EA İstanbul Üniversitesi Hukuk Fakültesi',topicProgress:caps.map(s=>({subject:s,percent:topicPercentage(s)})),recentQuestions:data.questions.slice(-50),recentSessions:data.sessions.slice(-40),recentExams:data.exams.slice(-8),recentTasks:data.tasks.filter(t=>t.date>=moveDate(today(),-7)&&t.date<=moveDate(today(),7)).slice(-80),mistakes:data.mistakes.slice(-20).map(({photoId,...m})=>m),coachInstructions:data.settings.coachInstructions||''};let abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),45000);let response;try{response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','X-Coach-Code':code},body:JSON.stringify({prompt,context}),signal:abort.signal})}finally{clearTimeout(timeout)}let res=await response.json().catch(()=>({}));if(!response.ok)throw Error(res.error||'Sunucu yanıt vermedi. AI bağlantısı henüz kurulmamış olabilir.');if(!res.answer)throw Error('AI yanıtı boş');data.messages.push({role:'user',text:prompt},{role:'assistant',text:String(res.answer).slice(0,10000)});if(data.messages.length>60)data.messages=data.messages.slice(-60);persist();render();flash('Koç yanıtladı')}catch(err){flash('AI: '+(err.name==='AbortError'?'İstek zaman aşımına uğradı':err.message))}finally{coachBusy=false;let button=document.querySelector('form[data-form="coach"] button');if(button){button.disabled=false;button.textContent='Mesajımı gönder'}}}
document.addEventListener('submit',submit);document.addEventListener('click',click);document.addEventListener('change',change);setInterval(clockTick,1000);document.addEventListener('visibilitychange',clockTick);window.addEventListener('pageshow',clockTick);
render();// GitHub Pages single-file edition; all local records are retained across code updates.
})();
